name: Build IPTV Pro preloader DEX
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/SeedProvider.java'
      - 'tools/VavooProvider.java'
      - 'tools/VavooStreamServer.java'
      - '.github/workflows/build-iptv-pro-preloader.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Android provider and DEX
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          mkdir -p build/preloader/classes build/preloader/dex
          javac -encoding UTF-8 -source 8 -target 8 \
            -cp "$SDK/platforms/android-35/android.jar" \
            -d build/preloader/classes tools/SeedProvider.java tools/VavooProvider.java tools/VavooStreamServer.java
          "$SDK/build-tools/35.0.0/d8" --min-api 32 --lib "$SDK/platforms/android-35/android.jar" \
            --output build/preloader/dex \
            $(find build/preloader/classes -name '*.class' | sort)
          base64 -w0 build/preloader/dex/classes.dex > tools/preloader-classes.dex.b64
          echo "DEX bytes: $(wc -c < build/preloader/dex/classes.dex)"
          echo "Base64 bytes: $(wc -c < tools/preloader-classes.dex.b64)"
      - name: Upload standalone DEX for APK injection
        uses: actions/upload-artifact@v4
        with:
          name: iptv-pro-hook-dex
          path: build/preloader/dex/classes.dex
          retention-days: 7
      - name: Prepare offline playlist and DEX package for IPTV Pro
        run: |
          set -euo pipefail
          mkdir -p build/preloader/package/assets/vavoo
          cp iptv-pro-vavoo-local.m3u build/preloader/package/assets/vavoo/iptv.m3u
          cp build/preloader/dex/classes.dex build/preloader/package/classes4.dex
          python3 - <<'PY'
          from pathlib import Path
          f=Path("build/preloader/package/assets/vavoo/iptv.m3u")
          data=f.read_text(encoding="utf-8")
          channels=data.count("#EXTINF:")
          assert data.startswith("#EXTM3U") and channels >= 9000, channels
          localhost=data.count("http://127.0.0.1:18497/play/")
          assert localhost==channels, f"Missing local VAVOO URLs: {localhost}/{channels}"
          print("Resolved by native Android provider on-demand:", localhost)
          print("Bundled offline VAVOO channels:", channels)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-pro-vavoo-offline-payload
          path: build/preloader/package/
          retention-days: 7
      - name: Export Android SDK APK signature verifier
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/preloader/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-verifier
          path: build/preloader/apksigner.jar
          retention-days: 7
