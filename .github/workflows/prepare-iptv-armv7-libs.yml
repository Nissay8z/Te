name: Retrieve compatible Android 32-bit VLC native runtimes
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/prepare-iptv-armv7-libs.yml
permissions:
  contents: read
jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch VLC libraries and shared Datastore native library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export/armeabi-v7a export/arm64-v8a
          for ver in 3.7.5 3.7.6 3.7.7; do
            echo "--- Trying VideoLAN libvlc-all $ver ---"
            curl -fLsS --retry 3 --max-time 180 "https://repo.maven.apache.org/maven2/org/videolan/android/libvlc-all/$ver/libvlc-all-$ver.aar" -o /tmp/libvlc.aar
            echo "Library paths:"
            unzip -Z1 /tmp/libvlc.aar | grep -E '(/armeabi-v7a/|/arm64-v8a/).*(libvlcjni|libvlc|libc\\+\\+_shared).so$' | head -20
            name=$(unzip -Z1 /tmp/libvlc.aar | grep '/arm64-v8a/libvlcjni.so$' | head -1)
            test -n "$name"
            unzip -p /tmp/libvlc.aar "$name" > /tmp/jni.so
            sum=$(sha256sum /tmp/jni.so | cut -d' ' -f1)
            echo "arm64 JNI: $sum (V13: 4f5ab5db5e1ac652d9a153453bd6acf0c4a5ea7cef6d1295386bc5500e46f86c)"
            if [[ "$sum" == "4f5ab5db5e1ac652d9a153453bd6acf0c4a5ea7cef6d1295386bc5500e46f86c" ]]; then
              echo "EXACT JNI MATCH: $ver"
              cp /tmp/libvlc.aar /tmp/selected.aar
              echo "$ver" > export/matching_version.txt
              break
            fi
            # Prefer most recently available matching major VLC runtime
            cp /tmp/libvlc.aar /tmp/selected.aar
            echo "$ver (non-exact)" > export/matching_version.txt
          done
          for lib in libvlc.so libvlcjni.so libc++_shared.so; do
            p=$(unzip -Z1 /tmp/selected.aar | grep "/armeabi-v7a/$lib$" | head -1)
            test -n "$p" || { echo "Missing $lib"; exit 1; }
            unzip -p /tmp/selected.aar "$p" > "export/armeabi-v7a/$lib"
            file "export/armeabi-v7a/$lib"
          done
          echo "VLC selected: $(cat export/matching_version.txt)"
          curl -fLsS --retry 3 --max-time 120 https://dl.google.com/dl/android/maven2/androidx/datastore/datastore-core-android/1.1.3/datastore-core-android-1.1.3.aar -o /tmp/datastore.aar
          d=$(unzip -Z1 /tmp/datastore.aar | grep '/armeabi-v7a/libdatastore_shared_counter.so$' | head -1)
          test -n "$d"
          unzip -p /tmp/datastore.aar "$d" > export/armeabi-v7a/libdatastore_shared_counter.so
          file export/armeabi-v7a/libdatastore_shared_counter.so
          sha256sum export/armeabi-v7a/*.so
      - uses: actions/upload-artifact@v4
        with:
          name: iptv-android-armeabi-v7a-native
          path: export/
          retention-days: 7
