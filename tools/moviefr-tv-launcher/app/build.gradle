plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nisskenzi.moviefrtvlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nisskenzi.moviefrtvlauncher'
        minSdk 24
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
